<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PasóEnJuárez | Noticias de la Frontera</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header-oficial">
    <div class="banner-imagen-full">
      <img src="images/header-bg.jpg" alt="Pasó En Juárez Header" class="header-banner-img">
    </div>
    <nav id="menu-navegacion">
      <a href="#" class="nav-btn active" data-categoria="todas">Inicio</a>
      <a href="#" class="nav-btn" data-categoria="seguridad">Seguridad</a>
      <a href="#" class="nav-btn" data-categoria="economia">Economía</a>
      <a href="#" class="nav-btn" data-categoria="puentes">Puentes</a>
    </nav>
  </header>

  <div class="layout-principal">
    <!-- COLUMNA IZQUIERDA: 2 espacios -->
    <aside class="columna-publicidad publicidad-izquierda">
      <div class="caja-banner-vertical"></div>
      <div class="caja-banner-vertical"></div>
    </aside>

    <div class="bloque-central">
      <main class="contenedor-noticias">Cargando...</main>
      <section class="seccion-cronologica">
        <div id="carrusel-cronologico"></div>
      </section>
    </div>

    <!-- COLUMNA DERECHA: 2 espacios -->
    <aside class="columna-publicidad publicidad-derecha">
      <div class="caja-banner-vertical"></div>
      <div class="caja-banner-vertical"></div>
    </aside>
  </div>

  <script src="anuncios.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
