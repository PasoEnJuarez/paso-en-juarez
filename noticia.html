<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noticia | PasóEnJuárez</title>
  
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="styles.css">
  
  <style>
    /* Estilos específicos para la vista detallada de la noticia */
    .layout-noticia {
      display: grid;
      grid-template-columns: 250px 1fr 250px;
      gap: 20px;
      max-width: 1300px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .articulo-completo {
      background: #1e293b;
      color: #f8fafc;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .articulo-completo h1 {
      font-size: 2rem;
      margin-bottom: 15px;
      color: #38bdf8;
    }
    .articulo-completo .meta-nota {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 20px;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }
    .articulo-completo .cuerpo-texto {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #e2e8f0;
      white-space: pre-line;
      margin-top: 20px;
    }
    .contenedor-multimedia-nota {
      margin: 20px 0;
      width: 100%;
      border-radius: 6px;
      overflow: hidden;
    }
    @media (max-width: 1024px) {
      .layout-noticia {
        grid-template-columns: 1fr;
      }
      .columna-publicidad {
        display: none;
      }
    }
  </style>
</head>
<body style="background: #0f172a; color: #f8fafc; font-family: sans-serif; margin: 0;">

  <!-- ENCABEZADO SIMPLIFICADO -->
  <header class="header-oficial" style="background: #0f172a; border-bottom: 2px solid #0284c7; padding: 15px; text-align: center;">
    <a href="index.html" style="color: #38bdf8; text-decoration: none; font-size: 1.5rem; font-weight: bold;">PasóEnJuárez</a>
  </header>

  <!-- LAYOUT CON PUBLICIDAD Y CONTENIDO -->
  <div class="layout-noticia">

    <!-- PUBLICIDAD IZQUIERDA -->
    <aside class="columna-publicidad" aria-label="Publicidad lateral izquierda">
      <div class="caja-banner-vertical" data-posicion-anuncio="0" style="width: 100%; height: 350px; background: #1e293b; margin-bottom: 20px; border-radius: 6px; overflow: hidden;"></div>
      <div class="caja-banner-vertical" data-posicion-anuncio="1" style="width: 100%; height: 350px; background: #1e293b; border-radius: 6px; overflow: hidden;"></div>
    </aside>

    <!-- CONTENIDO CENTRAL DE LA NOTICIA -->
    <main>
      <article class="articulo-completo">
        <div id="noticia-detalle-container">
          <div style="text-align: center; padding: 40px; color: #94a3b8;">
            <div class="spinner-carga"></div>
            <p>Cargando noticia...</p>
          </div>
        </div>
        
        <div style="margin-top: 30px;">
          <a href="index.html" style="background: #0284c7; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; display: inline-block;">← Volver al Inicio</a>
        </div>
      </article>
    </main>

    <!-- PUBLICIDAD DERECHA -->
    <aside class="columna-publicidad" aria-label="Publicidad lateral derecha">
      <div class="caja-banner-vertical" data-posicion-anuncio="2" style="width: 100%; height: 350px; background: #1e293b; margin-bottom: 20px; border-radius: 6px; overflow: hidden;"></div>
      <div class="caja-banner-vertical" data-posicion-anuncio="3" style="width: 100%; height: 350px; background: #1e293b; border-radius: 6px; overflow: hidden;"></div>
    </aside>

  </div>

  <footer style="text-align: center; padding: 20px; color: #64748b; font-size: 0.85rem; margin-top: 40px;">
    <p>&copy; 2026 PasóEnJuárez. Periódico digital independiente.</p>
  </footer>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://akwnmorymjhthdkcebri.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_1oNA-SbdvgSbWEwy_jZNew_UX4JVIMT';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    // Extraer ID de YouTube
    function obtenerYouTubeId(videoUrl) {
      if (!videoUrl) return '';
      const urlTrim = videoUrl.trim();
      let videoId = '';
      if (urlTrim.includes('youtu.be/')) {
        videoId = urlTrim.split('youtu.be/')[1]?.split('?')[0];
      } else if (urlTrim.includes('watch?v=')) {
        videoId = urlTrim.split('watch?v=')[1]?.split('&')[0];
      } else if (urlTrim.includes('embed/')) {
        videoId = urlTrim.split('embed/')[1]?.split('?')[0];
      }
      return videoId;
    }

    // Cargar Publicidad en la página de la noticia
    async function inicializarPublicidad() {
      if (!supabaseClient) return;
      try {
        const { data: anuncios, error } = await supabaseClient.from('Anuncios').select('*');
        if (error || !anuncios) return;

        const espaciosEscritorio = document.querySelectorAll('.columna-publicidad .caja-banner-vertical');
        espaciosEscritorio.forEach((contenedor) => {
          const indexStr = contenedor.getAttribute('data-posicion-anuncio');
          if (indexStr !== null) {
            const index = Number(indexStr);
            const anuncio = anuncios.find(a => Number(a.posicion) === index);
            const foto = anuncio ? (anuncio.imagen_desktop || anuncio.imagen) : null;
            
            if (anuncio && foto) {
              contenedor.innerHTML = `
                <a href="${anuncio.link || '#'}" target="_blank" style="width:100%; height:100%; display:block;">
                  <img src="${foto}" alt="${anuncio.nombre || 'Anuncio'}" style="width:100%; height:100%; object-fit:cover;">
                </a>`;
            }
          }
        });
      } catch (err) {
        console.error("Error al cargar publicidad:", err);
      }
    }

    // Cargar la Noticia Individual
    async function cargarDetalleNoticia() {
      const params = new URLSearchParams(window.location.search);
      const idNoticia = params.get('id');
      const contenedor = document.getElementById('noticia-detalle-container');

      if (!idNoticia || !supabaseClient) {
        contenedor.innerHTML = `<p style="color: #ef4444;">No se encontró la noticia solicitada.</p>`;
        return;
      }

      try {
        let { data: nota, error } = await supabaseClient
          .from('Noticias')
          .select('*')
          .eq('id', idNoticia)
          .single();

        if (error || !nota) {
          // Intento alternativo con minúsculas por si la tabla cambia
          const resAlt = await supabaseClient.from('noticias').select('*').eq('id', idNoticia).single();
          nota = resAlt.data;
        }

        if (!nota) {
          contenedor.innerHTML = `<p style="color: #ef4444;">La noticia ya no está disponible.</p>`;
          return;
        }

        // Procesar multimedia (Videos / Fotos)
        let mediaHTML = '';
        const ytId = obtenerYouTubeId(nota.video_url);
        
        if (ytId) {
          mediaHTML = `
            <div class="contenedor-multimedia-nota" style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000;">
              <iframe src="https://www.youtube.com/embed/${ytId}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border:0;" allowfullscreen></iframe>
            </div>`;
        } else if (nota.video_url && nota.video_url.includes('facebook')) {
          mediaHTML = `
            <div class="contenedor-multimedia-nota" style="padding: 20px; background: #0f172a; text-align: center; border: 1px solid #334155;">
              <a href="${nota.video_url}" target="_blank" style="color: #38bdf8; font-weight: bold; text-decoration: none;">Ver video completo en Facebook ↗</a>
            </div>`;
        } else {
          // Si no hay video, revisamos si tiene imagen principal
          const fotoPrincipal = nota.imagen_url || nota.galeria || nota.imagen;
          if (fotoPrincipal) {
            const urlFoto = Array.isArray(fotoPrincipal) ? fotoPrincipal[0] : String(fotoPrincipal).split(',')[0].trim();
            mediaHTML = `<div class="contenedor-multimedia-nota"><img src="${urlFoto}" alt="${nota.titulo}" style="width: 100%; height: auto; border-radius: 6px;"></div>`;
          }
        }

        const fechaFormateada = nota.created_at ? new Date(nota.created_at).toLocaleDateString('es-MX', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
        const catClase = nota.categoria ? nota.categoria.toLowerCase().trim().replace(/\s+/g, '-') : 'general';

        contenedor.innerHTML = `
          <span class="categoria ${catClase}" style="display:inline-block; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; background: #0284c7; color: white; margin-bottom: 10px;">${nota.categoria || 'General'}</span>
          <h1>${nota.titulo}</h1>
          <div class="meta-nota">
            <span>Publicado el ${fechaFormateada} en PasóEnJuárez</span>
          </div>
          ${mediaHTML}
          <div class="cuerpo-texto">${nota.contenido}</div>
        `;

      } catch (err) {
        console.error("Error cargando detalle:", err);
        contenedor.innerHTML = `<p style="color: #ef4444;">Hubo un error al cargar la noticia.</p>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      cargarDetalleNoticia();
      inicializarPublicidad();
    });
  </script>

</body>
</html>
