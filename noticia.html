<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PasóEnJuárez - Noticia</title>
  <style>
    body { 
      font-family: 'Segoe UI', Roboto, sans-serif; 
      background: #0f172a; 
      color: #f8fafc; 
      margin: 0; 
      padding: 20px; 
    }
    .noticia-container { 
      max-width: 800px; 
      margin: 0 auto; 
      background: #1e293b; 
      padding: 30px; 
      border-radius: 15px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
    }
    h1 { color: #38bdf8; margin-top: 0; }
    .meta { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
    img { width: 100%; max-height: 450px; object-fit: cover; border-radius: 10px; margin-bottom: 20px; }
    .contenido { line-height: 1.6; font-size: 1.1rem; white-space: pre-line; }
    .btn-volver { display: inline-block; margin-top: 20px; background: #38bdf8; color: #0f172a; padding: 10px 20px; text-decoration: none; border-radius: 8px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="noticia-container" id="detalle-noticia">
    <p style="text-align: center; color: #94a3b8;">Cargando noticia...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://akwnmorymjhthdkcebri.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_1oNA-SbdvgSbWEwy_jZNew_UX4JVIMT';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function cargarNoticiaUnica() {
      const params = new URLSearchParams(window.location.search);
      const idNoticia = params.get('id');
      const contenedor = document.getElementById('detalle-noticia');

      if (!idNoticia) {
        contenedor.innerHTML = '<h2>Noticia no encontrada</h2><p>No se especificó un ID válido.</p><a href="index.html" class="btn-volver">Volver al Inicio</a>';
        return;
      }

      const { data, error } = await supabaseClient
        .from('Noticias')
        .select('*')
        .eq('id', idNoticia)
        .single();

      if (error || !data) {
        contenedor.innerHTML = '<h2>Noticia no encontrada</h2><p>La noticia que buscas ya no existe o fue eliminada.</p><a href="index.html" class="btn-volver">Volver al Inicio</a>';
        return;
      }

      const imagenUrl = data.imagen_url || data.imagen || '';
      
      contenedor.innerHTML = `
        <span style="background: #334155; color: #38bdf8; padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; text-transform: uppercase;">${data.categoria}</span>
        <h1>${data.titulo}</h1>
        <div class="meta">Publicado en PasóEnJuárez</div>
        ${imagenUrl ? `<img src="${imagenUrl}" alt="Imagen de la noticia">` : ''}
        <div class="contenido">${data.contenido}</div>
        <a href="index.html" class="btn-volver">← Volver al Inicio</a>
      `;
      
      document.title = `${data.titulo} | PasóEnJuárez`;
    }

    cargarNoticiaUnica();
  </script>
</body>
</html>
