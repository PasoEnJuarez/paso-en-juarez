  <style>
    .layout-noticia {
      display: grid;
      grid-template-columns: 250px 1fr 250px;
      gap: 20px;
      max-width: 1300px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .articulo-completo {
      background: #1e293b;
      color: #f8fafc;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .articulo-completo h1 {
      font-size: 2rem;
      margin-bottom: 15px;
      color: #38bdf8;
    }
    .articulo-completo .meta-nota {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 20px;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }
    .articulo-completo .cuerpo-texto {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #e2e8f0;
      white-space: pre-line;
      margin-top: 20px;
    }
    .contenedor-multimedia-nota {
      margin: 20px 0;
      width: 100%;
      border-radius: 6px;
      overflow: hidden;
    }
    /* Estilos para la cuadrícula de fotos */
    .galeria-cuadricula {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 20px 0;
    }
    .galeria-cuadricula img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .galeria-cuadricula img:hover {
      transform: scale(1.02);
      opacity: 0.9;
    }
    @media (max-width: 1024px) {
      .layout-noticia {
        grid-template-columns: 1fr;
      }
      .columna-publicidad {
        display: none;
      }
    }
  </style>
</head>
