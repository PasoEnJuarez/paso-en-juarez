name: Actualizar Sitemap Automatico

on:
  schedule:
    # Se ejecuta todos los dias a las 06:00 UTC (medianoche hora de Ciudad Juarez)
    - cron: '0 6 * * *'
  # Permite ejecutarlo manualmente con un clic en GitHub cuando quieras
  workflow_dispatch:

jobs:
  build-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/checkout@v4
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install @supabase/supabase-js

      - name: Generar nuevo sitemap.xml
        run: node scripts/generate-sitemap.mjs

      - name: Guardar y subir sitemap.xml actualizado al repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: sitemap.xml actualizado automaticamente" && git push)
