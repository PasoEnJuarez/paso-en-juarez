name: Actualizar Sitemap Automatico

on:
  schedule:
    - cron: '0 6 * * *' # Se ejecuta diariamente a las 12:00 AM (Hora de Ciudad Juárez)
  workflow_dispatch:

jobs:
  build-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install @supabase/supabase-js

      - name: Generar nuevo sitemap.xml
        run: node scripts/generate-sitemap.mjs

      - name: Guardar y subir sitemap.xml actualizado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: sitemap.xml actualizado automaticamente" && git push)
