<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin | PasóEnJuárez</title>
  <style>
    body { 
      font-family: 'Segoe UI', Roboto, sans-serif; 
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
      color: #f8fafc; 
      margin: 0; 
      padding: 10px; 
      min-height: 100vh; 
      box-sizing: border-box; 
    }
    .admin-container { 
      width: 100%;
      max-width: 750px; 
      margin: 15px auto; 
      background: rgba(30, 41, 59, 0.85); 
      backdrop-filter: blur(10px); 
      padding: 20px; 
      border-radius: 20px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
      border: 1px solid rgba(255,255,255,0.1); 
      box-sizing: border-box;
    }
    h2, h3 { 
      color: #38bdf8; 
      text-align: center; 
      margin-bottom: 20px; 
      font-size: 1.4rem;
    }
    .form-group { 
      margin-bottom: 15px; 
    }
    label { 
      display: block; 
      margin-bottom: 6px; 
      color: #94a3b8; 
      font-weight: 500; 
      font-size: 0.95rem;
    }
    input, select, textarea { 
      width: 100%; 
      padding: 12px; 
      border-radius: 12px; 
      border: 2px solid #334155; 
      background: #0f172a; 
      color: #fff; 
      transition: border-color 0.3s; 
      box-sizing: border-box; 
      font-size: 16px; /* Evita zoom automático en iOS */
    }
    input:focus, select:focus, textarea:focus { 
      border-color: #38bdf8; 
      outline: none; 
    }
    button { 
      background: #38bdf8; 
      color: #0f172a; 
      border: none; 
      padding: 14px; 
      border-radius: 12px; 
      cursor: pointer; 
      font-weight: bold; 
      width: 100%; 
      transition: transform 0.2s, background 0.3s; 
      margin-top: 5px; 
      font-size: 1rem;
    }
    button:active { 
      transform: scale(0.98); 
    }
    .btn-danger { background: #f43f5e; color: white; margin-top: 10px; }
    .btn-warning { background: #fbbf24; color: #000; }
    
    .item-noticia { 
      display: flex; 
      flex-direction: row;
      align-items: center; 
      background: rgba(15, 23, 42, 0.6); 
      padding: 12px; 
      border-radius: 15px; 
      margin-bottom: 10px; 
      border: 1px solid rgba(255,255,255,0.05); 
      gap: 10px;
    }
    .item-noticia img { 
      width: 50px; 
      height: 50px; 
      object-fit: cover; 
      border-radius: 10px; 
      flex-shrink: 0; 
    }
    .item-info { 
      flex-grow: 1; 
      min-width: 0; /* Permite que el texto haga wrap y no rompa el flex */
    }
    .item-info h4 { 
      margin: 0; 
      font-size: 14px; 
      color: #f8fafc; 
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .botones-accion {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
    }
    .botones-accion button {
      padding: 6px 10px;
      font-size: 12px;
      margin-top: 0;
      width: auto;
    }
    .oculto { display: none; }
    #mensaje-login, #mensaje-publicacion, #mensaje-anuncio { text-align: center; font-weight: bold; margin-top: 15px; font-size: 0.9rem; }
    #preview-imagen-actual { width: 80px; height: 80px; object-fit: cover; border-radius: 10px; border: 2px solid #38bdf8; margin-bottom: 8px; display: none; }

    /* Media queries para pantallas todavía más pequeñas (móviles compactos) */
    @media (min-width: 600px) {
      body { padding: 20px; }
      .admin-container { padding: 35px; }
      .botones-accion { flex-direction: row; }
      .botones-accion button { padding: 8px 12px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="seccion-login" class="admin-container">
    <h2>🔐 Ingresar</h2>
    <form id="form-login">
      <div class="form-group">
        <label>Correo:</label>
        <input type="email" value="pasoenjuarez@gmail.com" readonly>
      </div>
      <div class="form-group">
        <label>Contraseña:</label>
        <input type="password" id="login-password" required autocomplete="new-password" placeholder="••••••••">
      </div>
      <button type="submit">Iniciar Sesión</button>
    </form>
    <p id="mensaje-login" style="color: #f43f5e;"></p>
  </div>

  <!-- PANEL DE GESTIÓN -->
  <div id="seccion-panel" class="admin-container oculto">
    
    <!-- GESTIÓN DE NOTICIAS -->
    <h2>✍️ <span id="titulo-modo">Nueva Noticia</span></h2>
    <form id="form-noticia">
      <input type="hidden" id="edit-id">
      <div class="form-group">
        <label>Título:</label>
        <input type="text" id="titulo" required>
      </div>
      <div class="form-group">
        <label>Categoría:</label>
        <select id="categoria">
          <option value="seguridad">Seguridad</option>
          <option value="economia">Economía</option>
          <option value="puentes">Puentes</option>
          <option value="politica">Política</option>
          <option value="tecnologia">Tecnología</option>
          <option value="medio ambiente">Medio Ambiente</option>
          <option value="cultura">Cultura</option>
          <option value="migracion">Migración</option>
        </select>
      </div>
      <div class="form-group">
        <label>Imagen principal:</label>
        <div id="contenedor-preview" class="oculto">
          <p style="font-size: 12px; color: #38bdf8; margin: 0 0 5px 0;">Imagen actual:</p>
          <img id="preview-imagen-actual" src="" alt="Imagen actual">
        </div>
        <input type="file" id="imagen" accept="image/*">
      </div>
      <div class="form-group">
        <label>🔗 URL de Video de Facebook (Opcional):</label>
        <input type="url" id="video-url" placeholder="https://www.facebook.com/watch?v=...">
      </div>
      <div class="form-group">
        <label>Contenido:</label>
        <textarea id="contenido" required rows="4"></textarea>
      </div>
      <button type="submit" id="btn-publicar">Publicar Noticia</button>
      <button type="button" id="btn-cancelar-edit" class="btn-danger oculto" onclick="cancelarEdicion()">Cancelar Edición</button>
    </form>
    <p id="mensaje-publicacion" style="color: #38bdf8;"></p>

    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 30px 0;">

    <!-- GESTIÓN DE ANUNCIOS PUBLICITARIOS -->
    <h2>📢 Gestionar Anuncios (4 Espacios)</h2>
    <form id="form-anuncio">
      <div class="form-group">
        <label>Posición del Anuncio:</label>
        <select id="anuncio-posicion" required>
          <option value="0">Espacio 1 (Superior Izquierda)</option>
          <option value="1">Espacio 2 (Inferior Izquierda)</option>
          <option value="2">Espacio 3 (Superior Derecha)</option>
          <option value="3">Espacio 4 (Inferior Derecha)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nombre del Patrocinador:</label>
        <input type="text" id="anuncio-nombre" placeholder="Ej. Negocio Local" required>
      </div>
      <div class="form-group">
        <label>Imagen (GIF o WebP animado):</label>
        <input type="file" id="anuncio-imagen" accept="image/jpeg,image/png,image/webp,image/gif">
      </div>
      <div class="form-group">
        <label>🔗 Enlace Web (URL):</label>
        <input type="url" id="anuncio-link" placeholder="https://sitio-del-cliente.com" required>
      </div>
      <button type="submit" id="btn-guardar-anuncio" style="background: #10b981; color: white;">Guardar / Actualizar Anuncio</button>
    </form>
    <p id="mensaje-anuncio" style="color: #34d399;"></p>

    <div id="lista-admin-anuncios" style="margin-top: 20px;">
      <p style="text-align: center; color: #94a3b8; font-size: 0.9rem;">Cargando anuncios actuales...</p>
    </div>

    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 30px 0;">

    <h3>📰 Noticias Publicadas</h3>
    <div id="lista-admin-noticias">
      <p style="text-align: center; color: #94a3b8; font-size: 0.9rem;">Cargando noticias...</p>
    </div>

    <button class="btn-danger" onclick="location.reload()" style="margin-top: 25px;">Cerrar Sesión</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://akwnmorymjhthdkcebri.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_1oNA-SbdvgSbWEwy_jZNew_UX4JVIMT';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    window.onload = () => {
      document.getElementById('login-password').value = '';
    };

    document.getElementById('form-login').onsubmit = async (e) => {
      e.preventDefault();
      const pass = document.getElementById('login-password').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email: 'pasoenjuarez@gmail.com', password: pass });
      
      if (error) {
        document.getElementById('mensaje-login').textContent = 'Contraseña incorrecta';
      } else {
        document.getElementById('seccion-login').classList.add('oculto');
        document.getElementById('seccion-panel').classList.remove('oculto');
        cargarNoticiasAdmin();
        cargarAnunciosAdmin();
      }
    };

    // --- NOTICIAS ---
    async function cargarNoticiasAdmin() {
      const contenedor = document.getElementById('lista-admin-noticias');
      const { data, error } = await supabaseClient.from('Noticias').select('*').order('id', { ascending: false });

      if (error || !data) {
        contenedor.innerHTML = '<p style="text-align:center; color:#f43f5e;">Error al cargar noticias</p>';
        return;
      }
      if (data.length === 0) {
        contenedor.innerHTML = '<p style="text-align: center; color: #94a3b8; font-size:0.9rem;">No hay noticias publicadas.</p>';
        return;
      }

      contenedor.innerHTML = '';
      data.forEach(n => {
        const fotoNoticia = n.imagen_url || n.imagen || 'https://via.placeholder.com/50';
        contenedor.innerHTML += `
          <div class="item-noticia">
            <img src="${fotoNoticia}" alt="Miniatura" onerror="this.src='https://via.placeholder.com/50'">
            <div class="item-info">
              <h4>${n.titulo}</h4>
              <p style="margin: 2px 0 0 0; font-size: 11px; color: #94a3b8;">Cat: ${n.categoria}</p>
            </div>
            <div class="botones-accion">
              <button class="btn-warning" onclick="prepararEdicion(${n.id}, '${n.titulo.replace(/'/g, "\\'")}', '${n.categoria}', '${n.contenido.replace(/'/g, "\\'").replace(/\n/g, "\\n")}', '${n.video_url || ''}', '${fotoNoticia}')">Editar</button>
              <button class="btn-danger" onclick="eliminarNoticia(${n.id})">Borrar</button>
            </div>
          </div>
        `;
      });
    }

    document.getElementById('form-noticia').onsubmit = async (e) => {
      e.preventDefault();
      const btnPublicar = document.getElementById('btn-publicar');
      const mensajePub = document.getElementById('mensaje-publicacion');
      const editId = document.getElementById('edit-id').value;

      btnPublicar.disabled = true;
      mensajePub.textContent = 'Guardando...';

      try {
        const archivo = document.getElementById('imagen').files[0];
        let urlImagen = null;

        if (archivo) {
          const nombreArchivo = `${Date.now()}_${archivo.name.replace(/\s+/g, '_')}`;
          const { error: uploadError } = await supabaseClient.storage.from('imagenes-noticias').upload(nombreArchivo, archivo);
          if (uploadError) throw new Error('Error al subir la imagen');
          urlImagen = supabaseClient.storage.from('imagenes-noticias').getPublicUrl(nombreArchivo).data.publicUrl;
        }

        const datosNoticia = {
          titulo: document.getElementById('titulo').value,
          categoria: document.getElementById('categoria').value,
          contenido: document.getElementById('contenido').value,
          video_url: document.getElementById('video-url').value
        };

        if (urlImagen) datosNoticia.imagen_url = urlImagen;

        if (editId) {
          await supabaseClient.from('Noticias').update(datosNoticia).eq('id', editId);
          mensajePub.textContent = '¡Noticia actualizada con éxito!';
        } else {
          await supabaseClient.from('Noticias').insert(datosNoticia);
          mensajePub.textContent = '¡Noticia publicada con éxito!';
        }

        cancelarEdicion();
        cargarNoticiasAdmin();
        setTimeout(() => mensajePub.textContent = '', 3000);
      } catch (err) {
        mensajePub.style.color = '#f43f5e';
        mensajePub.textContent = err.message;
      } finally {
        btnPublicar.disabled = false;
      }
    };

    function prepararEdicion(id, titulo, categoria, contenido, videoUrl, imagenUrl) {
      document.getElementById('edit-id').value = id;
      document.getElementById('titulo').value = titulo;
      document.getElementById('categoria').value = categoria;
      document.getElementById('contenido').value = contenido;
      document.getElementById('video-url').value = videoUrl !== 'undefined' ? videoUrl : '';
      
      const imgPreview = document.getElementById('preview-imagen-actual');
      const contenedorPreview = document.getElementById('contenedor-preview');
      if (imagenUrl && imagenUrl !== 'undefined') {
        imgPreview.src = imagenUrl;
        contenedorPreview.classList.remove('oculto');
        imgPreview.style.display = 'block';
      } else {
        contenedorPreview.classList.add('oculto');
      }

      document.getElementById('titulo-modo').textContent = 'Editar Noticia';
      document.getElementById('btn-publicar').textContent = 'Guardar Cambios';
      document.getElementById('btn-cancelar-edit').classList.remove('oculto');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicion() {
      document.getElementById('form-noticia').reset();
      document.getElementById('edit-id').value = '';
      document.getElementById('titulo-modo').textContent = 'Nueva Noticia';
      document.getElementById('btn-publicar').textContent = 'Publicar Noticia';
      document.getElementById('btn-cancelar-edit').classList.add('oculto');
      document.getElementById('contenedor-preview').classList.add('oculto');
      document.getElementById('preview-imagen-actual').style.display = 'none';
    }

    async function eliminarNoticia(id) {
      if (confirm('¿Estás seguro de eliminar esta noticia?')) {
        await supabaseClient.from('Noticias').delete().eq('id', id);
        cargarNoticiasAdmin();
      }
    }

    // --- ANUNCIOS ---
    async function cargarAnunciosAdmin() {
      const contenedor = document.getElementById('lista-admin-anuncios');
      const { data, error } = await supabaseClient.from('Anuncios').select('*').order('posicion', { ascending: true });

      if (error || !data) {
        contenedor.innerHTML = '<p style="text-align:center; color:#f43f5e;">Error al cargar anuncios</p>';
        return;
      }
      if (data.length === 0) {
        contenedor.innerHTML = '<p style="text-align: center; color: #94a3b8; font-size:0.9rem;">No hay anuncios configurados.</p>';
        return;
      }

      contenedor.innerHTML = '<h4 style="color:#38bdf8; margin-bottom:10px; font-size:1rem;">Banners Activos:</h4>';
      data.forEach(a => {
        const nombresEspacios = ["Espacio 1 (Sup. Izq)", "Espacio 2 (Inf. Izq)", "Espacio 3 (Sup. Der)", "Espacio 4 (Inf. Der)"];
        contenedor.innerHTML += `
          <div class="item-noticia">
            <img src="${a.imagen}" alt="Anuncio" onerror="this.src='https://via.placeholder.com/50'">
            <div class="item-info">
              <h4>[${nombresEspacios[a.posicion] || 'Espacio'}] ${a.nombre}</h4>
              <p style="margin: 2px 0 0 0; font-size: 11px; color: #94a3b8; word-break: break-all;">Link: ${a.link}</p>
            </div>
          </div>
        `;
      });
    }

    document.getElementById('form-anuncio').onsubmit = async (e) => {
      e.preventDefault();
      const btnGuardar = document.getElementById('btn-guardar-anuncio');
      const mensajeAnuncio = document.getElementById('mensaje-anuncio');
      const posicion = parseInt(document.getElementById('anuncio-posicion').value);
      const nombre = document.getElementById('anuncio-nombre').value;
      const link = document.getElementById('anuncio-link').value;
      const archivo = document.getElementById('anuncio-imagen').files[0];

      btnGuardar.disabled = true;
      mensajeAnuncio.textCont = 'Guardando anuncio...';

      try {
        let urlImagen = null;

        if (archivo) {
          const nombreArchivo = `anuncio_${posicion}_${Date.now()}_${archivo.name.replace(/\s+/g, '_')}`;
          const { error: uploadError } = await supabaseClient.storage.from('imagenes-noticias').upload(nombreArchivo, archivo);
          if (uploadError) throw new Error('Error al subir la imagen del anuncio');
          urlImagen = supabaseClient.storage.from('imagenes-noticias').getPublicUrl(nombreArchivo).data.publicUrl;
        }

        const { data: existente } = await supabaseClient.from('Anuncios').select('*').eq('posicion', posicion);

        const datosAnuncio = { posicion, nombre, link };
        if (urlImagen) datosAnuncio.imagen = urlImagen;

        if (existente && existente.length > 0) {
          if (!urlImagen) delete datosAnuncio.imagen;
          await supabaseClient.from('Anuncios').update(datosAnuncio).eq('posicion', posicion);
        } else {
          if (!urlImagen) throw new Error('Debes seleccionar una imagen para este nuevo anuncio');
          await supabaseClient.from('Anuncios').insert(datosAnuncio);
        }

        mensajeAnuncio.textContent = '¡Anuncio guardado con éxito!';
        document.getElementById('form-anuncio').reset();
        cargarAnunciosAdmin();
        setTimeout(() => mensajeAnuncio.textContent = '', 3000);
      } catch (err) {
        mensajeAnuncio.style.color = '#f43f5e';
        mensajeAnuncio.textContent = err.message;
      } finally {
        btnGuardar.disabled = false;
        mensajeAnuncio.style.color = '#34d399';
      }
    };
  </script>
</body>
</html>
