<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - PasóEnJuárez</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }
    .admin-container {
      max-width: 900px;
      margin: 0 auto;
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 25px;
      color: #38bdf8;
      border-bottom: 2px solid #334155;
      padding-bottom: 12px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: bold;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      border-radius: 6px;
      font-size: 1rem;
    }
    textarea {
      resize: vertical;
      min-height: 150px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn-publicar {
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-publicar:hover {
      background: #0369a1;
    }
    #mensaje-estado {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <h1>Panel de Administración - Publicar Noticia</h1>
    <form id="form-noticia">
      <div class="form-group">
        <label for="titulo">Título de la Noticia:</label>
        <input type="text" id="titulo" required placeholder="Escribe el título aquí...">
      </div>

      <div class="form-group">
        <label for="categoria">Categoría:</label>
        <select id="categoria">
          <option value="seguridad">Seguridad</option>
          <option value="economia">Economía</option>
          <option value="puentes">Puentes</option>
          <option value="politica">Política</option>
          <option value="tecnologia">Tecnología</option>
          <option value="medio ambiente">Medio Ambiente</option>
          <option value="historia">Historia</option>
          <option value="migracion">Migración</option>
          <option value="clima">Clima</option>
          <option value="cultura">Cultura</option>
        </select>
      </div>

      <div class="form-group">
        <label for="imagen_url">URL de la Imagen Principal:</label>
        <input type="text" id="imagen_url" placeholder="https://ejemplo.com/foto.jpg">
      </div>

      <div class="form-group">
        <label for="video_url">URL de Video (YouTube o Facebook opcional):</label>
        <input type="text" id="video_url" placeholder="https://www.youtube.com/watch?v=...">
      </div>

      <div class="form-group">
        <label for="contenido">Contenido de la Noticia:</label>
        <textarea id="contenido" required placeholder="Escribe la noticia completa..."></textarea>
      </div>

      <button type="submit" class="btn-publicar">Publicar Noticia</button>
      <div id="mensaje-estado"></div>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://akwnmorymjhthdkcebri.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_1oNA-SbdvgSbWEwy_jZNew_UX4JVIMT';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    document.getElementById('form-noticia').addEventListener('submit', async (e) => {
      e.preventDefault();
      const estado = document.getElementById('mensaje-estado');
      estado.style.color = '#38bdf8';
      estado.textContent = 'Publicando...';

      if (!supabaseClient) {
        estado.style.color = '#ef4444';
        estado.textContent = 'Error: Cliente de Supabase no inicializado.';
        return;
      }

      const titulo = document.getElementById('titulo').value.trim();
      const categoria = document.getElementById('categoria').value;
      const imagen_url = document.getElementById('imagen_url').value.trim();
      const video_url = document.getElementById('video_url').value.trim();
      const contenido = document.getElementById('contenido').value.trim();

      try {
        const { data, error } = await supabaseClient
          .from('Noticias')
          .insert([{ titulo, categoria, imagen_url, video_url, contenido }]);

        if (error) {
          const { error: errorAlt } = await supabaseClient
            .from('noticias')
            .insert([{ titulo, categoria, imagen_url, video_url, contenido }]);
          
          if (errorAlt) throw errorAlt;
        }

        estado.style.color = '#22c55e';
        estado.textContent = '¡Noticia publicada con éxito!';
        document.getElementById('form-noticia').reset();
      } catch (err) {
        console.error(err);
        estado.style.color = '#ef4444';
        estado.textContent = 'Error al publicar: ' + (err.message || 'Desconocido');
      }
    });
  </script>
</body>
</html>
