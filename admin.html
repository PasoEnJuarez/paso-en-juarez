<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel Admin | PasóEnJuárez</title>
  <style>
    body { 
      font-family: 'Segoe UI', Roboto, sans-serif; 
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
      color: #f8fafc; 
      margin: 0; 
      padding: 10px; 
      min-height: 100vh; 
      box-sizing: border-box; 
    }
    .admin-container { 
      width: 100%;
      max-width: 750px; 
      margin: 15px auto; 
      background: rgba(30, 41, 59, 0.85); 
      backdrop-filter: blur(10px); 
      padding: 20px; 
      border-radius: 20px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
      border: 1px solid rgba(255,255,255,0.1); 
      box-sizing: border-box;
    }
    h2, h3 { 
      color: #38bdf8; 
      text-align: center; 
      margin-bottom: 20px; 
      font-size: 1.4rem;
    }
    .form-group { 
      margin-bottom: 15px; 
    }
    label { 
      display: block; 
      margin-bottom: 6px; 
      color: #94a3b8; 
      font-weight: 500; 
      font-size: 0.95rem;
    }
    input, select, textarea { 
      width: 100%; 
      padding: 12px; 
      border-radius: 12px; 
      border: 2px solid #334155; 
      background: #0f172a; 
      color: #fff; 
      transition: border-color 0.3s; 
      box-sizing: border-box; 
      font-size: 16px;
    }
    input:focus, select:focus, textarea:focus { 
      border-color: #38bdf8; 
      outline: none; 
    }
    button { 
      background: #38bdf8; 
      color: #0f172a; 
      border: none; 
      padding: 14px; 
      border-radius: 12px; 
      cursor: pointer; 
      font-weight: bold; 
      width: 100%; 
      transition: transform 0.2s, background 0.3s; 
      margin-top: 5px; 
      font-size: 1rem;
    }
    button:active { 
      transform: scale(0.98); 
    }
    .btn-danger { background: #f43f5e; color: white; margin-top: 10px; }
    .btn-warning { background: #fbbf24; color: #000; }
    
    .item-noticia { 
      display: flex; 
      flex-direction: row;
      align-items: center; 
      background: rgba(15, 23, 42, 0.6); 
      padding: 12px; 
      border-radius: 15px; 
      margin-bottom: 10px; 
      border: 1px solid rgba(255,255,255,0.05); 
      gap: 10px;
    }
    .item-noticia img { 
      width: 50px; 
      height: 50px; 
      object-fit: cover; 
      border-radius: 10px; 
      flex-shrink: 0; 
      background: #334155;
    }
    .item-info { 
      flex-grow: 1; 
      min-width: 0; 
    }
    .item-info h4 { 
      margin: 0; 
      font-size: 14px; 
      color: #f8fafc; 
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .botones-accion {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
    }
    .botones-accion button {
      padding: 6px 10px;
      font-size: 12px;
      margin-top: 0;
      width: auto;
    }
    .oculto { display: none; }
    #mensaje-login, #mensaje-publicacion, #mensaje-anuncio { text-align: center; font-weight: bold; margin-top: 15px; font-size: 0.9rem; }

    @media (min-width: 600px) {
      body { padding: 20px; }
      .admin-container { padding: 35px; }
      .botones-accion { flex-direction: row; }
      .botones-accion button { padding: 8px 12px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <div id="seccion-login" class="admin-container">
    <h2>🔐 Ingresar</h2>
    <form id="form-login" method="post" action="#">
      <div class="form-group">
        <label for="login-email">Correo:</label>
        <input type="email" id="login-email" name="email" value="pasoenjuarez@gmail.com" readonly>
      </div>
      <div class="form-group">
        <label for="login-password">Contraseña:</label>
        <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit">Iniciar Sesión</button>
    </form>
    <p id="mensaje-login" style="color: #f43f5e;"></p>
  </div>

  <div id="seccion-panel" class="admin-container oculto">
    
    <h2>✍️ <span id="titulo-modo">Nueva Noticia</span></h2>
    <form id="form-noticia">
      <input type="hidden" id="edit-id" name="edit_id">
      <div class="form-group">
        <label for="titulo">Título:</label>
        <input type="text" id="titulo" name="titulo" required>
      </div>
      <div class="form-group">
        <label for="categoria">Categoría:</label>
        <select id="categoria" name="categoria">
          <option value="seguridad">Seguridad</option>
          <option value="economia">Economía</option>
          <option value="local">Local</option>
          <option value="politica">Política</option>
          <option value="tecnologia">Tecnología</option>
          <option value="medio ambiente">Medio Ambiente</option>
          <option value="historia">Historia</option>
          <option value="migracion">Migración</option>
          <option value="clima">Clima</option>
          <option value="cultura">Cultura</option>
        </select>
      </div>
      <div class="form-group">
        <label for="imagen">Imagen(es) de la noticia (puedes seleccionar varias):</label>
        <div id="contenedor-preview" class="oculto" style="margin-bottom: 8px;">
          <p style="font-size: 12px; color: #38bdf8; margin: 0 0 5px 0;">Imagen(es) actual(es):</p>
          <div id="preview-galeria-actual" style="display: flex; gap: 6px; flex-wrap: wrap;"></div>
        </div>
        <input type="file" id="imagen" name="imagen" accept="image/*" multiple>
      </div>
      <div class="form-group">
        <label for="video-url">🔗 URL de Video de Facebook o YouTube (Opcional):</label>
        <input type="url" id="video-url" name="video_url" placeholder="https://www.youtube.com/watch?v=...">
      </div>
      <div class="form-group">
        <label for="contenido">Contenido:</label>
        <textarea id="contenido" name="contenido" required rows="4"></textarea>
      </div>
      <button type="submit" id="btn-publicar">Publicar Noticia</button>
      <button type="button" id="btn-cancelar-edit" class="btn-danger oculto" onclick="cancelarEdicion()">Cancelar Edición</button>
    </form>
    <p id="mensaje-publicacion" style="color: #38bdf8;"></p>

    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 30px 0;">

    <!-- SECCIÓN DE ADMINISTRACIÓN DE BANNERS / ANUNCIOS -->
    <h2>📢 Configuración de Banners Publicitarios</h2>
    <form id="form-anuncio">
      <div class="form-group">
        <label for="posicion-anuncio">Posición del Anuncio:</label>
        <select id="posicion-anuncio" name="posicion">
          <option value="0">Posición 0 (Lateral Izquierda Superior / Móvil Arriba)</option>
          <option value="1">Posición 1 (Lateral Izquierda Inferior / Móvil Abajo)</option>
          <option value="2">Posición 2 (Lateral Derecha Superior)</option>
          <option value="3">Posición 3 (Lateral Derecha Inferior)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="nombre-anuncio">Nombre del Patrocinador / Anuncio:</label>
        <input type="text" id="nombre-anuncio" placeholder="Ej: Restaurante Local" required>
      </div>
      <div class="form-group">
        <label for="imagen-anuncio-desktop">Imagen Banner Escritorio (Vertical):</label>
        <input type="file" id="imagen-anuncio-desktop" accept="image/*">
      </div>
      <div class="form-group">
        <label for="imagen-anuncio-movil">Imagen Banner Móvil (Horizontal / Opcional):</label>
        <input type="file" id="imagen-anuncio-movil" accept="image/*">
      </div>
      <div class="form-group">
        <label for="link-anuncio">Enlace de Destino (URL):</label>
        <input type="url" id="link-anuncio" placeholder="https://ejemplo.com" required>
      </div>
      <button type="submit" id="btn-anuncio">Guardar Anuncio</button>
    </form>
    <p id="mensaje-anuncio" style="color: #38bdf8;"></p>

    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 30px 0;">

    <h3>📰 Noticias Publicadas</h3>
    <div id="lista-admin-noticias">
      <p style="text-align: center; color: #94a3b8; font-size: 0.9rem;">Cargando noticias...</p>
    </div>

    <button class="btn-danger" onclick="location.reload()" style="margin-top: 25px;">Cerrar Sesión</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://api.pasoenjuarez.com';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrd25tb3J5bWpodGhka2NlYnJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMTYwMTQsImV4cCI6MjEwMjU5MjAxNH0.bIwjqCL1ckId5hnGFPfropYBMrv92V7ecAYkGfe1QL8';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let noticiasAdminCache = []; 
    const IMG_DEFAULT = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='50' height='50'%3E%3Crect width='50' height='50' fill='%23334155'/%3E%3Ctext x='50%25' y='50%25' fill='%2394a3b8' font-size='10' text-anchor='middle' dominant-baseline='central'%3ES/I%3C/text%3E%3C/svg%3E";

    function comprimirImagenWebP(archivo, anchoMaximo = 1200, calidad = 0.8) {
      return new Promise((resolve, reject) => {
        const lector = new FileReader();
        lector.readAsDataURL(archivo);
        lector.onload = (evento) => {
          const img = new Image();
          img.src = evento.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let escala = 1;
            if (img.width > anchoMaximo) {
              escala = anchoMaximo / img.width;
            }
            canvas.width = img.width * escala;
            canvas.height = img.height * escala;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            canvas.toBlob((blob) => {
              if (!blob) {
                reject(new Error('Error al comprimir la imagen'));
                return;
              }
              const nombreLimpio = archivo.name.replace(/\.[^/.]+$/, "") + ".webp";
              const archivoComprimido = new File([blob], nombreLimpio, {
                type: 'image/webp',
                lastModified: Date.now()
              });
              resolve(archivoComprimido);
            }, 'image/webp', calidad);
          };
          img.onerror = (err) => reject(err);
        };
        lector.onerror = (err) => reject(err);
      });
    }

    function obtenerListaFotos(nota) {
      const textoImagenes = nota.imagen_url || nota.galeria;
      if (!textoImagenes) return [];
      let listaFotos = Array.isArray(textoImagenes) ? textoImagenes : String(textoImagenes).split(',');
      return listaFotos.map(img => {
        let urlLimpia = String(img).replace(/\\/g, '/').trim();
        return urlLimpia.replace('https://akwnmorymjhthdkcebri.supabase.co', 'https://api.pasoenjuarez.com');
      }).filter(img => img.length > 0);
    }

    window.onload = () => {
      document.getElementById('login-password').value = '';
    };

    document.getElementById('form-login').onsubmit = async (e) => {
      e.preventDefault();
      const pass = document.getElementById('login-password').value;
      const mensajeLogin = document.getElementById('mensaje-login');
      mensajeLogin.style.color = '#38bdf8';
      mensajeLogin.textContent = 'Verificando...';

      const { error } = await supabaseClient.auth.signInWithPassword({ email: 'pasoenjuarez@gmail.com', password: pass });
      
      if (error) {
        mensajeLogin.style.color = '#f43f5e';
        mensajeLogin.textContent = 'Contraseña incorrecta';
      } else {
        mensajeLogin.textContent = '';
        document.getElementById('seccion-login').classList.add('oculto');
        document.getElementById('seccion-panel').classList.remove('oculto');
        cargarNoticiasAdmin();
      }
    };

    async function cargarNoticiasAdmin() {
      const contenedor = document.getElementById('lista-admin-noticias');
      const { data, error } = await supabaseClient.from('Noticias').select('*').order('id', { ascending: false });

      if (error || !data) {
        contenedor.innerHTML = '<p style="text-align:center; color:#f43f5e;">Error al cargar noticias</p>';
        return;
      }
      
      noticiasAdminCache = data;

      if (data.length === 0) {
        contenedor.innerHTML = '<p style="text-align: center; color: #94a3b8; font-size:0.9rem;">No hay noticias publicadas.</p>';
        return;
      }

      contenedor.innerHTML = '';
      data.forEach(n => {
        const listaFotos = obtenerListaFotos(n);
        const fotoNoticia = listaFotos.length > 0 ? listaFotos[0] : IMG_DEFAULT;
        contenedor.innerHTML += `
          <div class="item-noticia">
            <img src="${fotoNoticia}" alt="Miniatura" onerror="this.src='${IMG_DEFAULT}'">
            <div class="item-info">
              <h4>${n.titulo}</h4>
              <p style="margin: 2px 0 0 0; font-size: 11px; color: #94a3b8;">Cat: ${n.categoria} ${listaFotos.length > 1 ? `| 📸 ${listaFotos.length} fotos` : ''}</p>
            </div>
            <div class="botones-accion">
              <button class="btn-warning" onclick="prepararEdicion(${n.id})">Editar</button>
              <button class="btn-danger" onclick="eliminarNoticia(${n.id})">Borrar</button>
            </div>
          </div>
        `;
      });
    }

    document.getElementById('form-noticia').onsubmit = async (e) => {
      e.preventDefault();
      const btnPublicar = document.getElementById('btn-publicar');
      const mensajePub = document.getElementById('mensaje-publicacion');
      const editId = document.getElementById('edit-id').value;

      btnPublicar.disabled = true;
      mensajePub.textContent = 'Comprimiendo imágenes y guardando...';

      try {
        const archivos = document.getElementById('imagen').files;
        let urlsImagenes = [];

        if (archivos.length > 0) {
          for (let i = 0; i < archivos.length; i++) {
            const archivoOriginal = archivos[i];
            const archivoComprimido = await comprimirImagenWebP(archivoOriginal, 1200, 0.8);
            const nombreArchivo = `${Date.now()}_${i}_${archivoComprimido.name.replace(/\s+/g, '_')}`;
            
            const { error: uploadError } = await supabaseClient.storage
              .from('imagenes-noticias')
              .upload(nombreArchivo, archivoComprimido, {
                cacheControl: '31536000',
                upsert: true
              });

            if (uploadError) throw new Error(`Error al subir la imagen: ${archivoOriginal.name}`);
            
            let publicUrl = supabaseClient.storage
              .from('imagenes-noticias')
              .getPublicUrl(nombreArchivo).data.publicUrl;

            publicUrl = publicUrl.replace('https://akwnmorymjhthdkcebri.supabase.co', 'https://api.pasoenjuarez.com');
            urlsImagenes.push(publicUrl);
          }
        }

        const datosNoticia = {
          titulo: document.getElementById('titulo').value,
          categoria: document.getElementById('categoria').value,
          contenido: document.getElementById('contenido').value,
          video_url: document.getElementById('video-url').value
        };

        if (urlsImagenes.length > 0) {
          datosNoticia.imagen_url = urlsImagenes.join(',');
        }

        if (editId) {
          const { error: updateError } = await supabaseClient.from('Noticias').update(datosNoticia).eq('id', editId);
          if (updateError) throw new Error(updateError.message);
          mensajePub.textContent = '¡Noticia actualizada con éxito!';
        } else {
          const { error: insertError } = await supabaseClient.from('Noticias').insert(datosNoticia);
          if (insertError) throw new Error(insertError.message);
          mensajePub.textContent = '¡Noticia publicada con éxito!';
        }

        cancelarEdicion();
        cargarNoticiasAdmin();
        setTimeout(() => mensajePub.textContent = '', 3000);
      } catch (err) {
        mensajePub.style.color = '#f43f5e';
        mensajePub.textContent = err.message;
      } finally {
        btnPublicar.disabled = false;
        mensajePub.style.color = '#38bdf8';
      }
    };

    // FORMULARIO Y LÓGICA DE PUBLICIDAD DE BANNERS
    document.getElementById('form-anuncio').onsubmit = async (e) => {
      e.preventDefault();
      const btnAnuncio = document.getElementById('btn-anuncio');
      const mensajeAnuncio = document.getElementById('mensaje-anuncio');

      btnAnuncio.disabled = true;
      mensajeAnuncio.textContent = 'Guardando banner...';

      try {
        const posicion = document.getElementById('posicion-anuncio').value;
        const nombre = document.getElementById('nombre-anuncio').value;
        const link = document.getElementById('link-anuncio').value;
        
        const fileDesktop = document.getElementById('imagen-anuncio-desktop').files[0];
        const fileMovil = document.getElementById('imagen-anuncio-movil').files[0];

        let urlDesktop = null;
        let urlMovil = null;

        if (fileDesktop) {
          const compDesktop = await comprimirImagenWebP(fileDesktop, 800, 0.8);
          const nameDesktop = `banner_desk_${posicion}_${Date.now()}.webp`;
          
          await supabaseClient.storage.from('imagenes-noticias').upload(nameDesktop, compDesktop, { upsert: true });
          urlDesktop = supabaseClient.storage.from('imagenes-noticias').getPublicUrl(nameDesktop).data.publicUrl;
          urlDesktop = urlDesktop.replace('https://akwnmorymjhthdkcebri.supabase.co', 'https://api.pasoenjuarez.com');
        }

        if (fileMovil) {
          const compMovil = await comprimirImagenWebP(fileMovil, 800, 0.8);
          const nameMovil = `banner_movil_${posicion}_${Date.now()}.webp`;
          
          await supabaseClient.storage.from('imagenes-noticias').upload(nameMovil, compMovil, { upsert: true });
          urlMovil = supabaseClient.storage.from('imagenes-noticias').getPublicUrl(nameMovil).data.publicUrl;
          urlMovil = urlMovil.replace('https://akwnmorymjhthdkcebri.supabase.co', 'https://api.pasoenjuarez.com');
        }

        const datosAnuncio = {
          posicion: Number(posicion),
          nombre: nombre,
          link: link
        };

        if (urlDesktop) datosAnuncio.imagen_desktop = urlDesktop;
        if (urlMovil) datosAnuncio.imagen_movil = urlMovil;

        const { error } = await supabaseClient.from('Anuncios').upsert(datosAnuncio, { onConflict: 'posicion' });

        if (error) throw error;

        mensajeAnuncio.textContent = '¡Banner guardado correctamente!';
        document.getElementById('form-anuncio').reset();
        setTimeout(() => mensajeAnuncio.textContent = '', 3000);

      } catch (err) {
        mensajeAnuncio.style.color = '#f43f5e';
        mensajeAnuncio.textContent = 'Error: ' + err.message;
      } finally {
        btnAnuncio.disabled = false;
        mensajeAnuncio.style.color = '#38bdf8';
      }
    };

    function prepararEdicion(id) {
      const nota = noticiasAdminCache.find(n => String(n.id) === String(id));
      if (!nota) return;

      document.getElementById('edit-id').value = nota.id;
      document.getElementById('titulo').value = nota.titulo || '';
      document.getElementById('categoria').value = nota.categoria || 'seguridad';
      document.getElementById('contenido').value = nota.contenido || '';
      document.getElementById('video-url').value = nota.video_url || '';
      
      const contenedorPreview = document.getElementById('contenedor-preview');
      const contenedorGaleriaActual = document.getElementById('preview-galeria-actual');
      const listaFotos = obtenerListaFotos(nota);

      if (listaFotos.length > 0) {
        contenedorGaleriaActual.innerHTML = listaFotos.map(foto => `
          <img src="${foto}" alt="Foto actual" style="width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 2px solid #38bdf8;">
        `).join('');
        contenedorPreview.classList.remove('oculto');
      } else {
        contenedorPreview.classList.add('oculto');
      }

      document.getElementById('titulo-modo').textContent = 'Editar Noticia';
      document.getElementById('btn-publicar').textContent = 'Guardar Cambios';
      document.getElementById('btn-cancelar-edit').classList.remove('oculto');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicion() {
      document.getElementById('form-noticia').reset();
      document.getElementById('edit-id').value = '';
      document.getElementById('titulo-modo').textContent = 'Nueva Noticia';
      document.getElementById('btn-publicar').textContent = 'Publicar Noticia';
      document.getElementById('btn-cancelar-edit').classList.add('oculto');
      document.getElementById('contenedor-preview').classList.add('oculto');
      document.getElementById('preview-galeria-actual').innerHTML = '';
    }

    async function eliminarNoticia(id) {
      if (confirm('¿Estás seguro de eliminar esta noticia?')) {
        try {
          const { error } = await supabaseClient.from('Noticias').delete().eq('id', id);
          if (error) throw new Error(error.message);
          cargarNoticiasAdmin();
        } catch (err) {
          alert('Error al borrar noticia: ' + err.message);
        }
      }
    }
  </script>
</body>
</html>
