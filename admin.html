<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Redacción | PasóEnJuárez</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
    .panel-container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 8px; border: 1px solid #334155; }
    h2 { color: #38bdf8; margin-top: 0; margin-bottom: 20px; font-size: 1.4rem; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
    input[type="text"], input[type="url"], select, textarea {
      width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 0.95rem;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #38bdf8; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .checkbox-group input { width: 18px; height: 18px; cursor: pointer; }
    button {
      width: 100%; background: #b91c1c; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #dc2626; }
    .mensaje { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; font-size: 0.9rem; text-align: center; }
    .exito { background: #065f46; color: #34d399; }
    .error { background: #7f1d1d; color: #fca5a5; }
  </style>
</head>
<body>

  <div class="panel-container">
    <h2>Publicar Noticia en Tiempo Real</h2>
    
    <form id="form-noticia">
      <div class="form-group">
        <label for="titulo">Título de la noticia *</label>
        <input type="text" id="titulo" placeholder="Escribe un título claro y conciso" required>
      </div>

      <div class="form-group">
        <label for="categoria">Categoría *</label>
        <select id="categoria" required>
          <option value="seguridad">Seguridad</option>
          <option value="economia">Economía</option>
          <option value="politica">Política</option>
          <option value="migracion">Migración</option>
          <option value="clima">Clima</option>
          <option value="tecnologia">Tecnología</option>
          <option value="cultura">Cultura</option>
        </select>
      </div>

      <div class="form-group">
        <label for="imagen_url">URL de la Imagen (Opcional)</label>
        <input type="url" id="imagen_url" placeholder="https://ejemplo.com/imagen.jpg">
      </div>

      <div class="form-group">
        <label for="video_url">URL de Video Embed (Opcional)</label>
        <input type="url" id="video_url" placeholder="https://www.youtube.com/embed/ID_DEL_VIDEO">
      </div>

      <div class="form-group">
        <label for="contenido">Cuerpo / Resumen de la noticia *</label>
        <textarea id="contenido" rows="5" placeholder="Escribe los detalles del acontecimiento..." required></textarea>
      </div>

      <div class="form-group">
        <label class="checkbox-group">
          <input type="checkbox" id="es_principal">
          <span>Marcar como noticia principal de portada</span>
        </label>
      </div>

      <button type="submit" id="btn-publicar">Publicar Noticia Ahora</button>
      <div id="mensaje-estado" class="mensaje"></div>
    </form>
  </div>

  <!-- LIBRERÍA DE SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    // Configuración de Supabase
    const SUPABASE_URL = 'https://akwnmorymjhthdkcebri.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_1oNA-SbdvgSbWEwy_jZNew_UX4JVIMT';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('form-noticia');
    const mensajeBox = document.getElementById('mensaje-estado');
    const btnPublicar = document.getElementById('btn-publicar');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      btnPublicar.disabled = true;
      btnPublicar.textContent = 'Publicando...';
      mensajeBox.style.display = 'none';

      const nuevaNota = {
        titulo: document.getElementById('titulo').value,
        categoria: document.getElementById('categoria').value,
        imagen_url: document.getElementById('imagen_url').value || null,
        video_url: document.getElementById('video_url').value || null,
        contenido: document.getElementById('contenido').value,
        es_principal: document.getElementById('es_principal').checked
      };

      // Inserción enviada a la tabla 'Noticias' (con N mayúscula)
      const { data, error } = await supabase.from('Noticias').insert([nuevaNota]);

      btnPublicar.disabled = false;
      btnPublicar.textContent = 'Publicar Noticia Ahora';

      if (error) {
        mensajeBox.className = 'mensaje error';
        mensajeBox.textContent = 'Error al publicar: ' + error.message;
        mensajeBox.style.display = 'block';
      } else {
        mensajeBox.className = 'mensaje exito';
        mensajeBox.textContent = '¡Noticia publicada con éxito en tiempo real!';
        mensajeBox.style.display = 'block';
        form.reset();
      }
    });
  </script>
  <!-- BANNER DE PUBLICIDAD / PATROCINADOR -->
<div style="background: linear-gradient(135deg, #1e293b, #0f172a); border: 2px dashed #334155; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 20px; color: #cbd5e1;">
  <span style="background: #eab308; color: #000; font-size: 0.65rem; font-weight: bold; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; display: inline-block; margin-bottom: 8px;">Espacio Publicitario</span>
  <h3 style="color: #f8fafc; font-size: 1.1rem; margin: 5px 0;">¡Anuncia tu negocio aquí!</h3>
  <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 12px;">Llega a miles de lectores diariamente en Ciudad Juárez.</p>
  <a href="mailto:tu-correo@ejemplo.com" style="background: #2563eb; color: #fff; padding: 6px 14px; border-radius: 4px; font-size: 0.85rem; text-decoration: none; font-weight: bold; display: inline-block;">Contáctanos</a>
</div>
</body>
</html>
