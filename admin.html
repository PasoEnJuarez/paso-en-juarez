<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración | PasóEnJuárez</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
    }
    .admin-container {
      max-width: 800px;
      margin: 0 auto;
      background: #1e293b;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    h1 {
      color: #38bdf8;
      text-align: center;
      margin-bottom: 30px;
    }
    .seccion-admin {
      margin-bottom: 30px;
      padding: 20px;
      background: #0f172a;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .seccion-admin h3 {
      color: #38bdf8;
      margin-top: 0;
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 0.9rem;
      color: #cbd5e1;
    }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      background: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    input[type="file"] {
      margin-bottom: 15px;
      color: #cbd5e1;
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    .volver-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #38bdf8;
      text-decoration: none;
      font-weight: bold;
    }
    .volver-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <a href="index.html" class="volver-link">← Volver al sitio principal</a>
    <h1>Panel de Administración</h1>

    <!-- SECCIÓN DE NOTICIAS -->
    <div class="seccion-admin">
      <h3>📰 Publicar / Gestionar Noticia</h3>
      
      <label for="admin-titulo">Título de la Noticia:</label>
      <input type="text" id="admin-titulo" placeholder="Escribe el título aquí...">

      <label for="admin-categoria">Categoría:</label>
      <select id="admin-categoria">
        <option value="seguridad">Seguridad</option>
        <option value="economia">Economía</option>
        <option value="puentes">Puentes</option>
        <option value="politica">Política</option>
        <option value="tecnologia">Tecnología</option>
        <option value="medio ambiente">Medio Ambiente</option>
        <option value="migracion">Migración</option>
        <option value="clima">Clima</option>
        <option value="cultura">Cultura</option>
      </select>

      <label for="admin-imagen">Imagen Principal o Galería:</label>
      <input type="file" id="admin-imagen" multiple>

      <label for="admin-video">Enlace de Video (YouTube o Facebook):</label>
      <input type="text" id="admin-video" placeholder="Ej. https://www.youtube.com/watch?v=...">

      <label for="admin-contenido">Contenido Completo:</label>
      <textarea id="admin-contenido" placeholder="Escribe la noticia completa..."></textarea>

      <button id="btn-publicar-noticia">Publicar Noticia</button>
    </div>

    <!-- SECCIÓN DE ANUNCIOS / PUBLICIDAD -->
    <div class="seccion-admin">
      <h3>📢 Gestión de Anuncios y Publicidad</h3>
      
      <label for="admin-anuncio-posicion">Posición del Anuncio (0 a 3):</label>
      <input type="text" id="admin-anuncio-posicion" placeholder="Ej. 0 (Izquierda arriba), 1, 2 o 3">

      <label for="admin-anuncio-link">Enlace de Destino (URL al hacer clic):</label>
      <input type="text" id="admin-anuncio-link" placeholder="https://tuweb.com">

      <label for="admin-anuncio-img">Imagen del Banner (Desktop):</label>
      <input type="file" id="admin-anuncio-img">

      <label for="admin-anuncio-img-movil">Imagen del Banner (Móvil - Opcional):</label>
      <input type="file" id="admin-anuncio-img-movil">

      <button id="btn-guardar-anuncio">Guardar / Actualizar Anuncio</button>
    </div>

  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Aquí puedes enlazar tu script del admin si usas uno independiente o embebido -->
</body>
</html>
