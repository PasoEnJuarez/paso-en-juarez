<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración | PasóEnJuárez</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .admin-container { max-width: 700px; margin: 20px auto; background: #1e293b; padding: 30px; border-radius: 10px; border: 1px solid #334155; }
    h2, h3 { color: #38bdf8; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: #cbd5e1; }
    input, select, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
    button { background: #2563eb; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 5px; }
    button:hover { background: #1d4ed8; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    .btn-warning { background: #f59e0b; color: #000; }
    .btn-warning:hover { background: #d97706; }
    .oculto { display: none; }
    #mensaje-login, #mensaje-publicacion { margin-top: 15px; text-align: center; font-weight: bold; }
    .item-noticia { display: flex; align-items: center; justify-content: space-between; background: #0f172a; padding: 12px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #334155; }
    .item-noticia img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; margin-right: 15px; }
    .item-info { flex-grow: 1; margin-right: 15px; }
    .item-info h4 { margin: 0 0 5px 0; font-size: 16px; color: #f8fafc; }
    .item-info p { margin: 0; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="seccion-login" class="admin-container">
    <h2>🔐 Ingresar a PasóEnJuárez</h2>
    <form id="form-login">
      <div class="form-group">
        <label>Correo:</label>
        <input type="email" id="login-email" value="pasoenjuarez@gmail.com" readonly>
      </div>
      <div class="form-group">
        <label>Contraseña:</label>
        <input type="password" id="login-password" required placeholder="Ingresa tu contraseña">
      </div>
      <button type="submit" style="width:100%;">Iniciar Sesión</button>
    </form>
    <p id="mensaje-login"></p>
  </div>

  <!-- PANEL DE PUBLICACIÓN Y GESTIÓN -->
  <div id="seccion-panel" class="admin-container oculto">
    <h2>✍️ <span id="titulo-modo">Nueva Noticia</span></h2>
    <form id="form-noticia">
      <input type="hidden" id="edit-id"> <!-- Campo oculto para saber si estamos editando -->
      <div class="form-group">
        <label>Título:</label>
        <input type="text" id="titulo" required>
      </div>
      <div class="form-group">
        <label>Categoría:</label>
        <select id="categoria">
          <option value="seguridad">Seguridad</option>
          <option value="economia">Economía</option>
          <option value="puentes">Puentes</option>
          <option value="politica">Política</option>
          <option value="tecnologia">Tecnología</option>
          <option value="medio ambiente">Medio Ambiente</option>
          <option value="cultura">Cultura</option>
          <option value="migracion">Migración</option>
        </select>
      </div>
      <div class="form-group">
        <label>Imagen (déjalo vacío si no deseas cambiar la actual al editar):</label>
        <input type="file" id="imagen" accept="image/*">
      </div>
      <div class="form-group">
        <label>Contenido:</label>
        <textarea id="contenido" required rows="5"></textarea>
      </div>
      <button type="submit" id="btn-publicar" style="width:100%;">Publicar Noticia</button>
      <button type="button" id="btn-cancelar-edit" class="btn-danger oculto" style="width:100%; margin-top:5px;" onclick="cancelarEdicion()">Cancelar Edición</button>
    </form>
    <button class="btn-danger" onclick="location.reload()" style="width:100%; margin-top:20px;">Cerrar Sesión</button>
    <p id="mensaje-publicacion"></p>

    <hr style="border: 0; border-top: 1px solid #334155; margin: 30px 0;">

    <!-- LISTA DE NOTICIAS EXISTENTES -->
    <h3>📰 Noticias Publicadas</h3>
    <div id="lista-admin-noticias">
      <p style="text-align: center; color: #94a3b8;">Cargando noticias...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://akwnmorymjhthdkcebri.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_1oNA-SbdvgSbWEwy_jZNew_UX4JVIMT';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Login
    document.getElementById('form-login').onsubmit = async (e) => {
      e.preventDefault();
      const pass = document.getElementById('login-password').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email: 'pasoenjuarez@gmail.com', password: pass });
      
      if (error) {
        document.getElementById('mensaje-login').style.color = '#ef4444';
        document.getElementById('mensaje-login').textContent = 'Contraseña incorrecta';
      } else {
        document.getElementById('seccion-login').classList.add('oculto');
        document.getElementById('seccion-panel').classList.remove('oculto');
        cargarNoticiasAdmin(); // Cargar la lista al entrar
      }
    };

    // Cargar lista de noticias en el panel
    async function cargarNoticiasAdmin() {
      const contenedor = document.getElementById('lista-admin-noticias');
      const { data, error } = await supabaseClient.from('Noticias').select('*').order('id', { ascending: false });

      if (error) {
        contenedor.innerHTML = '<p style="color:#ef4444; text-align:center;">Error al cargar noticias</p>';
        return;
      }

      if (data.length === 0) {
        contenedor.innerHTML = '<p style="text-align: center; color: #94a3b8;">No hay noticias publicadas aún.</p>';
        return;
      }

      contenedor.innerHTML = '';
      data.forEach(noticia => {
        contenedor.innerHTML += `
          <div class="item-noticia">
            <img src="${noticia.imagen_url || 'https://via.placeholder.com/50'}" alt="Miniatura">
            <div class="item-info">
              <h4>${noticia.titulo}</h4>
              <p>Categoría: <b>${noticia.categoria}</b></p>
            </div>
            <div>
              <button class="btn-warning" onclick="prepararEdicion(${noticia.id}, '${noticia.titulo.replace(/'/g, "\\'")}', '${noticia.categoria}', '${noticia.contenido.replace(/'/g, "\\'").replace(/\n/g, "\\n")}', '${noticia.imagen_url}')">Editar</button>
              <button class="btn-danger" onclick="eliminarNoticia(${noticia.id})">Borrar</button>
            </div>
          </div>
        `;
      });
    }

    // Guardar (Publicar o Actualizar)
    document.getElementById('form-noticia').onsubmit = async (e) => {
      e.preventDefault();
      const btnPublicar = document.getElementById('btn-publicar');
      const mensajePub = document.getElementById('mensaje-publicacion');
      const editId = document.getElementById('edit-id').value;

      btnPublicar.disabled = true;
      mensajePub.style.color = '#38bdf8';
      mensajePub.textContent = 'Guardando cambios...';

      try {
        const archivo = document.getElementById('imagen').files[0];
        let urlImagen = null;

        // Si seleccionó una nueva imagen, la subimos
        if (archivo) {
          const nombreArchivo = `${Date.now()}_${archivo.name.replace(/\s+/g, '_')}`;
          const { error: uploadError } = await supabaseClient.storage.from('imagenes-noticias').upload(nombreArchivo, archivo);
          if (uploadError) throw new Error('Error al subir la nueva imagen');
          
          urlImagen = supabaseClient.storage.from('imagenes-noticias').getPublicUrl(nombreArchivo).data.publicUrl;
        }

        // Datos a enviar
        const datosNoticia = {
          titulo: document.getElementById('titulo').value,
          categoria: document.getElementById('categoria').value,
          contenido: document.getElementById('contenido').value
        };

        if (urlImagen) {
          datosNoticia.imagen_url = urlImagen; // Solo actualizamos la foto si subió una nueva
        }

        if (editId) {
          // MODO ACTUALIZAR
          const { error: updateError } = await supabaseClient.from('Noticias').update(datosNoticia).eq('id', editId);
          if (updateError) throw new Error('Error al actualizar la noticia');
          mensajePub.textContent = '¡Noticia actualizada con éxito!';
        } else {
          // MODO CREAR NUEVA
          const { error: insertError } = await supabaseClient.from('Noticias').insert(datosNoticia);
          if (insertError) throw new Error('Error al guardar la noticia');
          mensajePub.textContent = '¡Noticia publicada con éxito!';
        }

        mensajePub.style.color = '#22c55e';
        cancelarEdicion();
        cargarNoticiasAdmin();
        setTimeout(() => mensajePub.textContent = '', 3000);
      } catch (err) {
        mensajePub.style.color = '#ef4444';
        mensajePub.textContent = err.message;
      } finally {
        btnPublicar.disabled = false;
      }
    };

    // Cargar datos en el formulario para editar
    function prepararEdicion(id, titulo, categoria, contenido, imagenActual) {
      document.getElementById('edit-id').value = id;
      document.getElementById('titulo').value = titulo;
      document.getElementById('categoria').value = categoria;
      document.getElementById('contenido').value = contenido;
      
      document.getElementById('titulo-modo').textContent = 'Editar Noticia';
      document.getElementById('btn-publicar').textContent = 'Guardar Cambios';
      document.getElementById('btn-cancelar-edit').classList.remove('oculto');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Cancelar edición y limpiar formulario
    function cancelarEdicion() {
      document.getElementById('form-noticia').reset();
      document.getElementById('edit-id').value = '';
      document.getElementById('titulo-modo').textContent = 'Nueva Noticia';
      document.getElementById('btn-publicar').textContent = 'Publicar Noticia';
      document.getElementById('btn-cancelar-edit').classList.add('oculto');
    }

    // Eliminar noticia
    async function eliminarNoticia(id) {
      if (confirm('¿Estás seguro de que deseas eliminar esta noticia?')) {
        const { error } = await supabaseClient.from('Noticias').delete().eq('id', id);
        if (error) {
          alert('Error al eliminar la noticia');
        } else {
          cargarNoticiasAdmin();
        }
      }
    }
  </script>
</body>
</html>
